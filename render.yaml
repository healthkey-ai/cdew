# CDEW on Render — staging (#31 Part C). Independent, like PRISM: this repo owns
# its Blueprint, its own Postgres and its own secrets; it reaches promop only over
# promop's API (design §11, promop-alignment.md §2.6–§2.7).
#
# No GCP: the LLM is Claude via the Anthropic API (the hk-labs setup on Render),
# uploaded originals live on a Render persistent disk, and DocAI geometry OCR is off.
#
# PHI GATE: until BAA-covered Render (HIPAA-enabled workspace) and Anthropic
# setups are in place, this environment takes SYNTHETIC documents only — never
# real patient data.
#
# The live staging resources were created through the Render API to match this
# file (README → Deploy); it is the reference configuration and validates with
# `render blueprints validate render.yaml`.

databases:
  - name: cdew-db
    databaseName: cdew
    user: cdew
    plan: "0.1c-256mb"
    postgresMajorVersion: "16"
    region: oregon
    ipAllowList: []          # no external access; only Render services connect

services:
  - type: web
    name: cdew
    runtime: docker
    dockerfilePath: ./Dockerfile     # API + built SPA in one container
    dockerContext: .
    region: oregon                   # same region as promop / phr staging
    # Prefect thread dispatch runs its ephemeral API inside the web process, so
    # leave headroom; shrink once a Prefect server + worker take over.
    plan: "1c-2g"
    branch: dev
    autoDeployTrigger: checksPass    # deploy only after the commit's CI checks pass
    healthCheckPath: /api/v1/health/
    preDeployCommand: python manage.py migrate --noinput
    # Uploaded originals (PHI). A disk means one instance and no zero-downtime deploys.
    disk:
      name: cdew-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      # ── Django ──────────────────────────────────────────────────────────
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true          # CDEW's own; never shared with promop
      - key: DATABASE_URL
        fromDatabase:
          name: cdew-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1   # the *.onrender.com host is added from RENDER_EXTERNAL_HOSTNAME
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"

      # ── Pipeline / orchestration ────────────────────────────────────────
      - key: PREFECT_DISPATCH
        value: thread                # no Prefect server yet (design §6)
      - key: PIPELINE_AUTO_CLASSIFY
        value: "True"                # upload runs through classify → extract to review

      # ── LLM: Claude via the Anthropic API (no GCP) ──────────────────────
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        # claude-opus-5 / claude-sonnet-5 are safe with the pinned pydantic-ai 2.32.2.
        # Don't switch to claude-opus-5-5 or claude-fable-5-1 without upgrading it:
        # they reject the forced tool_choice it uses for structured output.
        value: claude-opus-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MAX_TOKENS
        value: "16000"

      # ── Storage + OCR ───────────────────────────────────────────────────
      - key: MEDIA_ROOT              # on the persistent disk above
        value: /var/data/media
      - key: DOCAI_ENABLED
        value: "False"               # Google Document AI; off without GCP

      # ── promop (object catalog sync, promop alignment P0) ────────────────
      - key: PROMOP_BASE_URL
        value: https://promop-staging.onrender.com

      # ── Staff sign-in (#31 Part A) ──────────────────────────────────────
      - key: PARTNER_AUTH_PROVIDERS
        value: apps.accounts.providers.jwks.JwksTokenProvider,apps.accounts.providers.firebase.FirebaseTokenProvider
      - key: PARTNER_AUTH_ISSUERS    # JSON list; see backend/.env.example
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_CONFIG     # public web config JSON; empty hides "Continue with Google"
        sync: false
