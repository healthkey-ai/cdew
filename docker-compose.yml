# Full local CDEW stack in Docker: Postgres, Prefect server, API, Prefect worker,
# and the Vite frontend. `docker compose up --build` from the repo root.
#
#   frontend  http://localhost:5173   (proxies /api → api:8000)
#   api       http://localhost:8000
#   prefect   http://localhost:4200   (UI)
#   postgres  localhost:5544          (cdew + prefect databases)
#
# Backend services read backend/.env (LLM / DocAI / pipeline flags); the values
# below override what must differ inside Docker. Google calls (Vertex, DocAI) use
# your host ADC — run `gcloud auth application-default login` on the host first.

name: cdew

x-backend: &backend
  build: ./backend
  image: cdew-backend:dev
  env_file: ./backend/.env
  volumes:
    - ./backend:/app # live code + shared MEDIA_ROOT (api and worker see the same files)
    - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.development
    DATABASE_URL: postgres://cdew:dev_only_change_in_prod@db:5432/cdew
    PREFECT_DISPATCH: deployment
    PREFECT_API_URL: http://prefect-server:4200/api
    PREFECT_UI_URL: http://localhost:4200

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdew
      POSTGRES_USER: cdew
      POSTGRES_PASSWORD: dev_only_change_in_prod
    ports:
      - "5544:5432" # not 5432 — avoids clashing with a native Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro # creates the `prefect` database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdew -d cdew"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Same image as the backend, so server and worker always run the same Prefect
  # version (a version mismatch breaks the server's DB migrations).
  prefect-server:
    image: cdew-backend:dev
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://cdew:dev_only_change_in_prod@db:5432/prefect
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "4200:4200"
    depends_on:
      db:
        condition: service_healthy
      api: # api owns the image build
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4200/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *backend
    command: python manage.py prefect_worker
    depends_on:
      prefect-server:
        condition: service_healthy

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # Linux deps; never the host's macOS node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
